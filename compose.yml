services:

  bot:
    build: .
    container_name: "bagidreport-bot"
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./:/usr/src/app
    command: ./entrypoint.sh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.2.3-alpine
    container_name: "bagidreport-redis"
    restart: unless-stopped
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
