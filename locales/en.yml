messages:

  main: |
    🤖 Here you can report content by Bag ID in TON Storage.

    <b>Send your message in the following format:</b>
    <code>&lt;Bag ID - 64 hex characters&gt;
    &lt;problem description&gt;</code>

    <b>Example:</b>
    <code>789BF4014D7566F5BFA9173B89009C9CA7C705D238598A509AF440BB60DA2EBE
    Distribution of malware, file contains a trojan</code>

  help: |
    ℹ️ <b>Help</b>

    <b>What this does:</b>
    Here you can report content by Bag ID in TON Storage. Reports are forwarded for moderation.

    <b>How to submit a report:</b>
    Your message must contain two lines:
    <code>&lt;Bag ID - 64 hex characters&gt;
    &lt;problem description&gt;</code>

    <b>Example:</b>
    <code>789BF4014D7566F5BFA9173B89009C9CA7C705D238598A509AF440BB60DA2EBE
    Distribution of malware, file contains a trojan</code>

    <b>Commands:</b>
    /start - launch the bot
    /help - open this help
    /lang - change interface language

    <b>Tips:</b>
    • Describe the issue clearly and in detail – this speeds up review.
    • If you made a mistake, send a new message in the correct format.

    <b>Privacy:</b>
    Your Bag ID and report text are visible to moderators for review.

  select_language: |
    🌐 <b>Select a language.</b>

  input_captcha: |
    🔐 <b>Enter the characters from the image.</b>

  select_reason: |
    ❓ <b>Select the reason for the complaint:</b>

  report_sent: |
    ✅ <b>Report submitted!</b>

    <b>Bag ID:</b> <code>{report_bag_id}</code>

    Your report has been forwarded for moderation.

  throttled: |
    Too many requests. Please wait a moment.

errors:

  invalid_format: |
    <blockquote>⚠️ <b>Invalid message format.</b>

    Please send your message in the exact format shown above.</blockquote>

  bag_id_invalid: |
    <blockquote>⚠️ <b>Invalid Bag ID.</b>

    Must be exactly 64 hexadecimal characters, without the <code>0x</code> prefix.</blockquote>

  problem_required: |
    <blockquote>⚠️ <b>Please describe the problem in more detail.</b>

    The description cannot be empty and must contain at least 3 words.</blockquote>

  problem_too_long: |
    <blockquote>⚠️ <b>Description is too long.</b>

    Maximum length is 1024 characters.</blockquote>

  non_text: |
    <blockquote>⚠️ <b>Unsupported message type.</b>

    Only text messages are accepted.</blockquote>

  captcha_wrong: |
    <blockquote>⚠️ <b>Incorrect captcha.</b>

    Please try again.</blockquote>

  captcha_expired: |
    <blockquote>⚠️ <b>Captcha has expired.</b>

    Please try again.</blockquote>

  message_expired: "⚠️ Message has expired. Please send a new request."

  unknown: |
    <blockquote>⚠️ <b>An unexpected error occurred.</b>

    Please try again.</blockquote>

  bag_already_banned: |
    <blockquote>⚠️ <b>This Bag ID is already banned.</b>

    No further action is needed.</blockquote>

  api_unavailable: |
    <blockquote>⚠️ <b>Service temporarily unavailable.</b>

    Please try again later.</blockquote>

