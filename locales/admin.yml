        <b>Поиск пользователя</b>

        Отправьте User ID в чат:
      detail: |
        <b>Пользователь</b>

        <b>• Telegram ID</b>: <code>{user_id}</code>
        <b>• Username</b>: {username}
        <b>• Имя</b>: {full_name}
        <b>• Язык</b>: <code>{language_code}</code>
        <b>• Статус</b>: <code>{state}</code>
        <b>• Заблокирован</b>: <code>{is_banned_text}</code>
        <b>• Дата регистрации</b>: <code>{created_at}</code>

    unban_bag: |
      <b>Разблокировать Bag</b>

      Отправьте Bag ID в чат:

    unban_bag_detail: |
      <b>Информация о блокировке</b>

      <b>• Bag ID</b>: <code>{bag_id}</code>
      <b>• Заблокирован</b>: <code>{ban_found_text}</code>
      <b>• Причина</b>: {ban_reason}
      <b>• Админ</b>: {ban_admin}
      <b>• Комментарий</b>: {ban_comment}

    create_ban: |
      <b>Заблокировать Bag</b>

      Отправьте Bag ID в чат:
    create_ban_reason: "<b>Выберите причину блокировки</b>"
    create_ban_comment: |
      <b>Комментарий</b>

      Отправьте комментарий или нажмите «Пропустить»:

    errors:
      invalid_user_id: |
        <blockquote>⚠️ <b>Неверный User ID.</b>

        Отправьте числовой Telegram ID.</blockquote>
      user_not_found: |
        <blockquote>⚠️ <b>Пользователь не найден.</b>

        Проверьте ID и попробуйте снова.</blockquote>
      invalid_bag_id: |
        <blockquote>⚠️ <b>Неверный Bag ID.</b>

        Допускаются ровно 64 шестнадцатеричных символа.</blockquote>
      bag_already_banned: |
        <blockquote>⚠️ <b>Bag ID уже заблокирован.</b>

        Повторная блокировка не требуется.</blockquote>
      api_unavailable: |
        <blockquote>⚠️ <b>Сервис временно недоступен.</b>

        Попробуйте позже.</blockquote>

