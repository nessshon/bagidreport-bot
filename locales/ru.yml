messages:

  main: |
    🤖 Этот бот принимает обращения по проблемам с Bag ID в TON Storage.
    
    <b>Отправьте сообщение строго в формате:</b>
    <code>&lt;Bag ID - 64 hex-символов&gt;
    &lt;описание проблемы - до 2048 символов&gt;</code>

    <b>Пример:</b>
    <code>789BF4014D7566F5BFA9173B89009C9CA7C705D238598A509AF440BB60DA2EBE
    Жестокое обращение с животными</code>

  help: |
    ℹ️ <b>Помощь</b>
    
    <b>Что делает бот:</b>
    Принимает обращения по проблемам с Bag ID в TON Storage и отправляет их на модерацию.
    
    <b>Как отправить обращение:</b>
    Сообщение должно содержать две строки:
    <code>&lt;Bag ID - 64 hex-символов&gt;
    &lt;описание проблемы - до 2048 символов&gt;</code>
    
    <b>Пример:</b>
    <code>789BF4014D7566F5BFA9173B89009C9CA7C705D238598A509AF440BB60DA2EBE
    Жестокое обращение с животными</code>

    <b>Команды:</b>
    /start - запустить бота  
    /help - открыть эту справку  
    /lang - сменить язык интерфейса
    
    <b>Советы:</b>
    • Опишите проблему развёрнуто и понятно - подробности ускоряют обработку обращения.  
    • Если допустили ошибку - отправьте новое сообщение в правильном формате.
    
    <b>Конфиденциальность:</b>
    Ваш Bag ID и текст обращения видны модераторам для разбора.

  select_language: |
    🌐 <b>Выберите язык.</b>

  input_captcha: |
    🔐 <b>Введите капчу.</b>

  select_reason: |
    ❓ <b>Выберите причину жалобы:</b>

  complaint_sent: |
    ✅ <b>Обращение отправлено!</b>

    <b>ID:</b> <code>{complaint_id}</code>
    <b>Bag ID:</b> <code>{complaint_bag_id}</code>

    Ваше обращение передано на модерацию.

  throttled: |
    Слишком часто. Подождите {ttl} сек.

errors:

  invalid_format: |
    <blockquote><b>Неверный формат сообщения.</b>
    
    Отправьте сообщение строго в формате, описанном выше.</blockquote>

  bag_id_invalid: |
    <blockquote><b>Неверный Bag ID.</b>
    
    Допускаются ровно 64 шестнадцатеричных символа, без префикса <code>0x</code>.</blockquote>

  problem_required: |
    <blockquote><b>Опишите проблему подробнее.</b>
    
    Описание не должно быть пустым и должно содержать минимум несколько слов.</blockquote>

  problem_too_long: |
    <blockquote><b>Слишком длинное описание.</b>
    
    Максимальная длина - 2048 символов.</blockquote>

  non_text: |
    <blockquote><b>Принимаются только текстовые сообщения.</b></blockquote>

  captcha_wrong: |
    <blockquote><b>Капча введена неверно.</b></blockquote>

  captcha_expired: |
    <blockquote><b>Время на ввод капчи истекло.</b>
    
    Попробуйте ещё раз.</blockquote>

  unknown: |
    <b>❗ Произошла непредвиденная ошибка.</b>
    
    Попробуйте ещё раз.

